<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador 4 Telas - Inglês Central</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #0f172a;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }
        .grid-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 3px;
            background: #334155;
            height: 100vh;
        }
        .pane {
            display: flex;
            flex-direction: column;
            background: #1e293b;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .url-bar {
            display: flex;
            padding: 4px;
            background: #1e293b;
            gap: 4px;
            border-bottom: 1px solid #334155;
        }
        .url-bar input {
            flex: 1;
            width: 100%;
            padding: 4px 6px;
            font-size: 11px;
            border-radius: 4px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f8fafc;
        }
        .url-bar button {
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .url-bar button:active {
            background: #1d4ed8;
        }
        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <!-- Tela 1 -->
        <div class="pane">
            <div class="url-bar">
                <input type="text" id="url1" value="https://inglescentral.com" placeholder="Cole o link aqui...">
                <button onclick="carregar(1)">Ir</button>
            </div>
            <iframe id="frame1" src="https://inglescentral.com" title="Tela 1"></iframe>
        </div>

        <!-- Tela 2 -->
        <div class="pane">
            <div class="url-bar">
                <input type="text" id="url2" value="https://inglescentral.com" placeholder="Cole o link aqui...">
                <button onclick="carregar(2)">Ir</button>
            </div>
            <iframe id="frame2" src="https://inglescentral.com" title="Tela 2"></iframe>
        </div>

        <!-- Tela 3 -->
        <div class="pane">
            <div class="url-bar">
                <input type="text" id="url3" value="https://inglescentral.com" placeholder="Cole o link aqui...">
                <button onclick="carregar(3)">Ir</button>
            </div>
            <iframe id="frame3" src="https://inglescentral.com" title="Tela 3"></iframe>
        </div>

        <!-- Tela 4 -->
        <div class="pane">
            <div class="url-bar">
                <input type="text" id="url4" value="https://inglescentral.com" placeholder="Cole o link aqui...">
                <button onclick="carregar(4)">Ir</button>
            </div>
            <iframe id="frame4" src="https://inglescentral.com" title="Tela 4"></iframe>
        </div>
    </div>

    <script>
        function carregar(numero) {
            var input = document.getElementById('url' + numero);
            var iframe = document.getElementById('frame' + numero);
            var link = input.value.trim();

            if (link !== "") {
                // Adiciona https:// automaticamente caso você cole sem
                if (!link.startsWith('http://') && !link.startsWith('https://')) {
                    link = 'https://' + link;
                    input.value = link;
                }
                iframe.src = link;
            }
        }
    </script>

</body>
</html>
