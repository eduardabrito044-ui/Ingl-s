<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Telas</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #111;
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 colunas */
            grid-template-rows: 1fr 1fr;    /* 2 linhas */
            gap: 4px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body>

    <!-- Substitua os links abaixo pelos links exatos das aulas que você quer abrir -->
    <iframe src="https://inglescentral.com" title="Aula 1"></iframe>
    <iframe src="https://inglescentral.com" title="Aula 2"></iframe>
    <iframe src="https://inglescentral.com" title="Aula 3"></iframe>
    <iframe src="https://inglescentral.com" title="Aula 4"></iframe>

</body>
</html>
